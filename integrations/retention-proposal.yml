name: Context retention proposal

on:
  workflow_dispatch:
  push:
    branches: [main]

# This is the repository's only confirmation deletion producer.
concurrency:
  group: context-retention-proposal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  propose:
    if: vars.CONTEXT_RETENTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CONTEXT_MAINTENANCE_TOKEN }}
      EXPECTED_ACTOR: ${{ vars.CONTEXT_MAINTENANCE_ACTOR }}
    steps:
      - name: Require an immutable official distribution and a dedicated maintenance account
        env:
          DISTRIBUTION: ${{ vars.CONTEXT_DISTRIBUTION_REVISION }}
        run: |
          test -n "$GH_TOKEN" && test -n "$EXPECTED_ACTOR"
          [[ "$DISTRIBUTION" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.CONTEXT_MAINTENANCE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v5
        with:
          repository: wh1teAlter/plugydown
          ref: ${{ vars.CONTEXT_DISTRIBUTION_REVISION }}
          path: .scratch/evidence/context-distribution
          persist-credentials: false
      - name: Prepare deletion-only change with the official Runtime
        id: prepare
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync } from 'node:fs'
          import { resolve } from 'node:path'
          import { prepareRetention } from './.scratch/evidence/context-distribution/integrations/retention.mjs'
          const base = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          const result = await prepareRetention({ root: process.cwd(), base, runtime: resolve('.scratch/evidence/context-distribution/runtime/context/main.mjs') })
          appendFileSync(process.env.GITHUB_OUTPUT, 'changed=' + (result.status === 'prepared') + '\nbase=' + base + '\n')
          console.log(JSON.stringify(result))
          JS
      - name: Publish only an owned proposal branch
        if: steps.prepare.outputs.changed == 'true'
        id: branch
        env:
          BASE: ${{ steps.prepare.outputs.base }}
        run: |
          test "$(gh api user --jq .login)" = "$EXPECTED_ACTOR"
          CURRENT=$(git ls-remote --heads origin refs/heads/main)
          test "${CURRENT%%[[:space:]]*}" = "$BASE"
          BRANCH="context-retention/$BASE"
          git -c core.hooksPath=/dev/null add -u -- context/.meta/confirmations
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false -c user.name='Context Maintenance' -c user.email='context-maintenance@users.noreply.github.com' commit -m 'chore(context): retain bounded confirmations'
          EXISTING=$(git ls-remote --heads origin "refs/heads/$BRANCH")
          if test -n "$EXISTING"; then
            EXISTING_SHA="${EXISTING%%[[:space:]]*}"
            git fetch --no-tags origin "$EXISTING_SHA"
            node .scratch/evidence/context-distribution/integrations/retention.mjs verify --runtime .scratch/evidence/context-distribution/runtime/context/main.mjs --base "$BASE" --head "$EXISTING_SHA"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Keep one proposal and require normal repository checks
        if: steps.prepare.outputs.changed == 'true'
        id: proposal
        uses: actions/github-script@v8
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          BASE: ${{ steps.prepare.outputs.base }}
        with:
          github-token: ${{ secrets.CONTEXT_MAINTENANCE_TOKEN }}
          script: |
            const {owner, repo} = context.repo
            const target = await github.rest.repos.getBranch({owner, repo, branch: 'main'})
            if (target.data.commit.sha !== process.env.BASE) throw new Error('Mainline changed; regenerate rather than replaying this plan.')
            const open = await github.paginate(github.rest.pulls.list, {owner, repo, state: 'open', base: 'main', per_page: 100})
            const owned = open.filter(pr => pr.user.login === process.env.EXPECTED_ACTOR && pr.head.repo?.full_name === context.payload.repository.full_name && pr.head.ref.startsWith('context-retention/'))
            for (const pr of owned) {
              if (pr.head.ref !== process.env.BRANCH) await github.rest.pulls.update({owner, repo, pull_number: pr.number, state: 'closed'})
            }
            const existing = owned.find(pr => pr.head.ref === process.env.BRANCH)
            const proposal = existing || (await github.rest.pulls.create({owner, repo, base: 'main', head: process.env.BRANCH, title: 'chore(context): retain bounded confirmations', body: 'Generated by the official compact transaction. Only historical confirmation files are deleted; current confirmation facts, Markdown and baselines are preserved. Require the retention guard and all existing checks before merging.', maintainer_can_modify: false})).data
            core.setOutput('number', String(proposal.number))
      - name: Request merge through existing protections and merge queue
        if: steps.prepare.outputs.changed == 'true'
        env:
          PR_NUMBER: ${{ steps.proposal.outputs.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash
