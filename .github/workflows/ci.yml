name: ci

# Checks only; it never publishes. Publishing is the hand-started release workflow, which calls this one.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    # Node 24 is the minimum supported major, for development and the plugin Runtime alike.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm pinned by the `packageManager` field.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm validate
      - name: Two consecutive builds produce identical artifacts and reports
        run: |
          snapshot() {
            node packages/context/scripts/verify-delivery.ts --snapshot
            pnpm --silent --filter @plugydown/context run inspect
          }
          snapshot > first.txt
          pnpm build
          snapshot > second.txt
          diff first.txt second.txt
      - name: Verify all six release units and execute their shipped Runtime
        run: pnpm verify:delivery

